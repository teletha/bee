project:
  name: bee
  # Rewritten by the release workflow to the released version, so the committed default is only a
  # placeholder.
  version: '0.0.0'
  java:
    groupId: com.github.teletha
  links:
    homepage: https://github.com/teletha/bee
release:
  github:
    owner: teletha
    name: bee
    tagName: '{{projectVersion}}'
    # The tag is created by the release task, so JReleaser creates only the GitHub
    # Release. The changelog is generated from the conventional commits.
    skipTag: true
    skipRelease: false
    overwrite: true
    changelog:
      formatted: ALWAYS
      preset: conventional-commits
      # Merge commits and commits which do not follow the conventional format are not shown.
      skipMergeCommits: true
      hide:
        uncategorized: true
        categories: [merge]
files:
  globs:
    - pattern: target/bee-{{projectVersion}}.jar
    - pattern: target/bee-{{projectVersion}}-sources.jar
    - pattern: target/bee-{{projectVersion}}-javadoc.jar
signing:
  pgp:
    active: RELEASE
    armored: true
    # The key material is injected through JRELEASER_GPG_SECRET_KEY,
    # JRELEASER_GPG_PUBLIC_KEY and JRELEASER_GPG_PASSPHRASE.
deploy:
  maven:
    mavenCentral:
      central:
        active: RELEASE
        url: https://central.sonatype.com/api/v1/publisher
        # The directory prepared by the release workflow, in Maven repository layout.
        stagingRepositories:
          - target/staging-deploy
        # The registered namespace of the Sonatype Central Portal account.
        namespace: com.github.teletha
        applyMavenCentralRules: true
